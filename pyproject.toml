[project]
name = "dk-sales"
version = "0.1.0"
description = "Pipeline data penjualan Dua Kelinci: profiling, audit kualitas data, cleaning, model data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "prometheus-client>=0.26.0",
    "httpx>=0.28.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
oidc = [
    "pyjwt[crypto]>=2.15.1",
]
observability = [
    "langfuse>=5.2.0",
]
llm = [
    "anthropic>=2.13.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk_sales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["e2e: browser tests (Playwright)"]

[tool.coverage.run]
source = ["dk_sales"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S311", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "BLE"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/dk_sales"]
