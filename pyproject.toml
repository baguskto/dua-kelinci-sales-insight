[project]
name = "dk-sales"
version = "0.1.0"
description = "Pipeline data penjualan Dua Kelinci: profiling, audit kualitas data, cleaning, model data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk_sales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["dk_sales"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
