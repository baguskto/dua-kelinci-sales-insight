name: ci

# Manual only until Bagus approves running CI on GitHub. To enable, replace with:
#   push: { branches: [main] }
#   pull_request:
#   schedule: [{ cron: "0 1 * * 1" }]   # weekly rebuild and rescan for new CVEs
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.6"
      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Raw data unchanged and docs match a fresh build
        run: uv run pytest -q tests/test_raw_and_idempotency.py
      - name: Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Tests with coverage (unit, integration, e2e)
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: Chat eval sets (offline)
        run: uv run python scripts/live_eval.py
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.6"
      - run: uv sync --frozen --all-extras
      - name: Dependency audit (pip-audit, hashed production lock)
        run: uv run pip-audit -r requirements-prod.lock --disable-pip --strict
      - name: Static analysis (bandit)
        run: uv run bandit -r src -q
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX)
        run: uvx --from cyclonedx-bom==5.1.1 cyclonedx-py requirements requirements-prod.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dua-kelinci-sales:ci .
      - name: Smoke test (read-only, non-root, healthy)
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8000:8000 dua-kelinci-sales:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec app id -u)" = 10001
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dua-kelinci-sales:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
      - name: Compose files are valid
        run: docker compose config --quiet
