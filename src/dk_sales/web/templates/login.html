{% extends "base.html" %}
{% block title %}Masuk - Penjualan Dua Kelinci{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Masuk</h1>
  {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
  {% if auth_mode == 'oidc' %}
    <p>Masuk dengan akun Microsoft 365 kantor.</p>
    <p><a class="button" href="/auth/entra/login">Masuk dengan Microsoft</a></p>
  {% else %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Nama pengguna <input name="username" autocomplete="username" required maxlength="80"></label>
    <label>Kata sandi <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit">Masuk</button>
  </form>
  {% endif %}
</section>
{% endblock %}
