<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf or '' }}">
<meta name="theme-color" content="#161616">
<title>{% block title %}Penjualan Dua Kelinci{% endblock %}</title>
<link rel="preload" href="/static/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/vendor/echarts-5.6.0.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body class="{% block bodyclass %}simple{% endblock %}">
<a class="skip" href="#main">Langsung ke isi</a>
{% block body %}
<header class="simplebar">
  <a class="logo-dot" href="/" aria-label="Penjualan Dua Kelinci, kembali ke dashboard"><img src="/static/img/logo-white.png" alt="" width="34" height="21"></a>
  <strong class="simplebar-title">Penjualan Dua Kelinci</strong>
  {% include "_who.html" %}
</header>
<main id="main" class="simple-main">
{% block content %}{% endblock %}
</main>
{% include "_footer.html" %}
{% endblock %}
</body>
</html>
