<form method="post" action="/upload" enctype="multipart/form-data" class="row upload" id="upload-form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label class="sr-only" for="upload-file">File penjualan</label>
  <input id="upload-file" type="file" name="file" accept=".csv,.xlsx,.txt" required>
  <button type="submit">Unggah dan periksa</button>
  <span class="small">CSV atau .xlsx, maksimal {{ settings.max_upload_mb }} MB dan {{ '{:,}'.format(settings.max_upload_rows).replace(',', '.') }} baris. Diperiksa dengan kontrak dan aturan yang sama.</span>
</form>
