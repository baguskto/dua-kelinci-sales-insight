# Generated by scripts/build_grafana.py
apiVersion: 1
groups:
  - orgId: 1
    name: "sales-insight"
    folder: "Dua Kelinci"
    interval: "1m"
    rules:
      - uid: "dk-5xx"
        title: "Rasio error 5xx di atas 5%"
        condition: "C"
        for: "5m"
        labels:
          severity: "critical"
          service: "sales-insight"
        annotations:
          summary: "Lebih dari 5% request gagal 5xx dalam 5 menit."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(rate(http_requests_total{status=~'5..'}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.05
      - uid: "dk-p95"
        title: "Latensi p95 di atas 2 detik"
        condition: "C"
        for: "10m"
        labels:
          severity: "warning"
          service: "sales-insight"
        annotations:
          summary: "Latensi p95 di atas 2 detik selama 10 menit."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 2
      - uid: "dk-guardrail"
        title: "Lonjakan fallback guardrail"
        condition: "C"
        for: "0m"
        labels:
          severity: "warning"
          service: "sales-insight"
        annotations:
          summary: "Lebih dari 5 jawaban AI diganti template dalam 15 menit. Cek model, prompt atau data."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(guardrail_fallbacks_total[15m]))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 5
      - uid: "dk-llm-budget"
        title: "Anggaran token LLM harian 80%"
        condition: "C"
        for: "0m"
        labels:
          severity: "warning"
          service: "sales-insight"
        annotations:
          summary: "Pemakaian token LLM hari ini sudah di atas 80% anggaran."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(llm_daily_budget_used_ratio)"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.8
      - uid: "dk-upload-fail"
        title: "Unggahan gagal berulang"
        condition: "C"
        for: "0m"
        labels:
          severity: "warning"
          service: "sales-insight"
        annotations:
          summary: "Lebih dari 3 unggahan ditolak dalam 30 menit. Mungkin format export berubah."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(uploads_total{result='rejected'}[30m]))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 3
      - uid: "dk-down"
        title: "Aplikasi tidak bisa di-scrape"
        condition: "C"
        for: "2m"
        labels:
          severity: "critical"
          service: "sales-insight"
        annotations:
          summary: "Prometheus tidak bisa membaca /metrics aplikasi selama 2 menit."
        noDataState: "OK"
        execErrState: "Error"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "up{job='dua-kelinci-app'}"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
