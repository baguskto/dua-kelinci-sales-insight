global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dua-kelinci-app
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["app-prod:8000"]
        labels:
          service: sales-insight

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
